[project]
name = "ugv-nav"
version = "0.1.0"
description = "Bounded navigation for a Waveshare UGV01 in a small test area (room, then balcony), with one evaluated ML contribution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5,<4",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8",
    "ruff>=0.9",
    "types-pyserial>=3.5",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests", "tools/ugv01_probe.py"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "PYI", "EXE"]

